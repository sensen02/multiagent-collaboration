<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Unison · 多模型工作台</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/style.css"></head><body>
<header><a class="brand" href="/">∷ <strong>unison</strong></a><span class="subtitle">多模型协作工作台</span><div class="header-right"><span id="connection">连接中</span><button id="model-button">模型设置</button></div></header>
<main><aside><div class="section-title">任务队列<button id="new-button" aria-label="新建任务">＋</button></div><div id="run-list"></div><div class="aside-foot">本地运行 · 共享知识 · 自主协作</div></aside>
<section class="workspace"><div class="run-heading"><div><div class="eyebrow">WORKSPACE</div><h1 id="run-title">让模型一起把事情做完</h1><p id="run-description">提交目标，让主模型选择如何执行与协作。</p></div><div id="run-actions" hidden><button id="change-button">修改目标</button><button id="archive-button">归档</button><button id="pause-button">暂停</button><button id="cancel-button" class="danger">停止</button></div></div>
<div id="error" role="alert" hidden></div>
<div class="tabs" role="tablist" aria-label="运行视图"><button class="active" role="tab" aria-selected="true" data-tab="graph">协作图</button><button role="tab" aria-selected="false" data-tab="files">文件修改</button><button role="tab" aria-selected="false" data-tab="knowledge">共享知识</button><button role="tab" aria-selected="false" data-tab="events">运行记录</button></div>
<div id="questions"></div><div id="content"><div class="empty"><div class="empty-symbol">∷</div><h2>从一个目标开始</h2><p>主模型可以直接工作，也可以邀请其他模型协作。</p><button class="primary" id="start-button">创建任务</button></div></div>
</section><section id="detail" class="detail" hidden></section></main>
<dialog id="new-dialog"><form id="new-form"><div class="dialog-title"><h2>创建任务</h2><button type="button" data-close>×</button></div><label>目标<textarea name="goal" required placeholder="希望完成什么？验收要求是什么？" rows="5"></textarea></label><label>主模型<select name="model_id" id="new-model" required></select></label><label>项目目录<input name="workspace" required placeholder="/home/sensen/Desktop/my-project"></label><p class="hint">主模型会直接修改该目录。子任务在独立副本中工作，结果可集成回来。</p><button class="primary" type="submit">加入队列</button></form></dialog>
<dialog id="model-dialog"><div class="dialog-title"><h2>模型设置</h2><button data-close>×</button></div><div id="models-list"></div><form id="model-form"><div class="form-row"><label>名称<input name="id" required placeholder="deepseek"></label><label>模型 ID<input name="model" required placeholder="服务商提供的模型 ID"></label></div><label>API 地址<input name="base_url" type="url" required placeholder="https://api.deepseek.com/v1"></label><label>API Key<input name="api_key" type="password" autocomplete="new-password" placeholder="保存到本机配置，或使用下方环境变量"></label><label>Key 环境变量<input name="key_env" placeholder="DEEPSEEK_API_KEY"></label><div class="form-row"><label>上下文窗口<input name="context_window" type="number" min="2048" value="32768"></label><label>最大输出<input name="max_output" type="number" min="128" value="4096"></label></div><label class="check"><input name="no_key" type="checkbox">本地服务无需 API Key</label><label>能力说明<input name="description" placeholder="供主模型选择时参考"></label><button class="primary">保存模型</button></form></dialog>
<dialog id="change-dialog"><form id="change-form"><div class="dialog-title"><h2>修改核心目标</h2><button type="button" data-close>×</button></div><label>新目标<textarea name="goal" required rows="5"></textarea></label><p class="hint">旧任务停止并归入历史，主模型可重新采纳有用成果。</p><button class="primary">切换目标版本</button></form></dialog>
<script src="/app.js" type="module"></script></body></html>
